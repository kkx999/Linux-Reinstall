name: Fix regenerate icon

on:
  push:
    paths:
      - .github/workflows/fix-regenerate-icon.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused icon fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html = Path('index.html')
          text = html.read_text()
          old = '                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8.1 8.1 0 1 0 2 5.3"/><path d="M20 4v7h-7"/></svg>'
          new = '                <svg class="regen-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 0-15-6.7L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 15 6.7L21 16"/><path d="M16 16h5v5"/></svg>'
          if text.count(old) != 1:
              raise SystemExit('regenerate SVG target not found exactly once')
          html.write_text(text.replace(old, new, 1))

          css = Path('assets/refine.css')
          text = css.read_text()
          old = '''.password-tools .text-button { padding: 0 2px; }
.password-tools .text-button svg {
  width: 15px;
  height: 15px;
  flex: 0 0 15px;
}'''
          new = '''.password-tools .text-button {
  height: 32px;
  padding: 0 2px;
  gap: 7px;
}
.password-tools .text-button svg {
  width: 16px;
  height: 16px;
  flex: 0 0 16px;
}'''
          if text.count(old) != 1:
              raise SystemExit('regenerate CSS target not found exactly once')
          text = text.replace(old, new, 1)
          old_mobile = '''  .password-tools .text-button,
  .password-tools .length-control { min-height: 30px; }'''
          new_mobile = '''  .password-tools .text-button,
  .password-tools .length-control { min-height: 30px; }
  .password-tools .text-button { height: 30px; }'''
          if text.count(old_mobile) != 1:
              raise SystemExit('mobile regenerate CSS target not found exactly once')
          css.write_text(text.replace(old_mobile, new_mobile, 1))
          PY
          node --check assets/app.js
          grep -q 'class="regen-icon"' index.html
      - name: Commit focused fix and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-regenerate-icon.yml
          git add index.html assets/refine.css
          git commit -m "fix: center regenerate password icon"
          git push
