name: Apply regenerate feedback

on:
  push:
    paths:
      - .github/workflows/apply-regenerate-feedback.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add regenerate interaction feedback
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('assets/refine.css')
          text = path.read_text()
          marker = '/* Regenerate password interaction feedback. */'
          if marker not in text:
              anchor = '''#regeneratePassword::before {
  content: "";
  width: 16px;
  height: 16px;
  flex: 0 0 16px;
'''
              if anchor not in text:
                  raise SystemExit('regenerate icon anchor not found')
              block = '''/* Regenerate password interaction feedback. */
#regeneratePassword {
  transition: color .16s ease, opacity .16s ease, transform .12s ease;
}
#regeneratePassword::before {
  transition: transform .34s cubic-bezier(.2,.75,.25,1);
  transform-origin: 50% 50%;
}
#regeneratePassword:hover { color: color-mix(in srgb, var(--accent) 82%, white); }
#regeneratePassword:active {
  transform: scale(.96);
  opacity: .78;
}
#regeneratePassword:active::before { transform: rotate(210deg); }

'''
              text = text.replace('/* Keep the password utility row on one clean visual baseline. */', block + '/* Keep the password utility row on one clean visual baseline. */', 1)
              path.write_text(text)
          PY
          node --check assets/app.js
      - name: Commit feedback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/refine.css
          git commit -m "ui: add regenerate password feedback"
          git push
