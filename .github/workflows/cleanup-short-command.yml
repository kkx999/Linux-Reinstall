name: Apply short command cleanup

on:
  push:
    paths:
      - .github/workflows/cleanup-short-command.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove bootstrap command expansion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('assets/app.js')
          text = path.read_text()

          start = text.index('  const BOOTSTRAP_LINES = [')
          end = text.index('\n\n  const state =', start)
          text = text[:start] + text[end + 2:]

          old = """    const lines = [
                ...BOOTSTRAP_LINES,
                '',
                `(curl -fL -o reinstall.sh ${downloadUrl} || wget -O reinstall.sh ${downloadUrl}) && ${slash}`
              ];"""
          if old not in text:
              old = """    const lines = [
              ...BOOTSTRAP_LINES,
              '',
              `(curl -fL -o reinstall.sh ${downloadUrl} || wget -O reinstall.sh ${downloadUrl}) && ${slash}`
            ];"""
          if old not in text:
              raise SystemExit('buildCommand bootstrap block not found')

          new = """    const lines = [`(curl -O ${downloadUrl} || wget -O reinstall.sh ${downloadUrl}) && ${slash}`];"""
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          node --check assets/app.js
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app.js
          git commit -m "refactor: restore short reinstall command"
          git push
